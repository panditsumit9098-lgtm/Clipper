name: Clipping Machine

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video link ya repo ki file (jaise input.mp4)"
        required: true
      num_clips:
        description: "Kitne clips"
        default: "5"

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Run clipper
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          NUM_CLIPS: ${{ github.event.inputs.num_clips }}
        run: python clipper.py

      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: output/
